{% extends "base.html" %}
{% block content %}
<style>
  body {
    background-color: #0f172a;
  }

  .main-wrapper {
    display: flex;
    gap: 20px;
  }

  .session-sidebar {
    width: 220px;
    background: #1e293b;
    color: white;
    border-radius: 12px;
    padding: 16px;
    height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
  }

  .new-chat-btn {
    background: #3b82f6;
    border: none;
    border-radius: 10px;
    color: white;
    font-weight: 500;
    padding: 8px 12px;
    cursor: pointer;
    margin-bottom: 10px;
    transition: background 0.2s;
  }

  .new-chat-btn:hover {
    background: #2563eb;
  }

  .session-link {
    display: block;
    color: #93c5fd;
    text-decoration: none;
    margin: 6px 0;
    padding: 6px 10px;
    border-radius: 8px;
    transition: background 0.2s;
  }

  .session-link:hover { background: #334155; }
  .session-link.active { background: #2563eb; color: white; }

  .chat-container {
    flex: 1;
    background: #1e293b;
    border-radius: 16px;
    padding: 20px;
    height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
  }

  .chat-header { text-align: center; color: #f8fafc; margin-bottom: 10px; }
  .chat-box { flex-grow: 1; overflow-y: auto; padding-right: 10px; scrollbar-width: thin; }

  .message { display: flex; align-items: flex-start; margin: 10px 0; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background-size: cover; }
  .ai-avatar { background-image: url("https://cdn-icons-png.flaticon.com/512/4712/4712109.png"); margin-right: 10px; }
  .user-avatar { background-image: url("https://cdn-icons-png.flaticon.com/512/1077/1077012.png"); margin-left: 10px; }

  .assistant { justify-content: flex-start; }
  .user { justify-content: flex-end; }

  .bubble {
    padding: 12px 16px;
    border-radius: 16px;
    max-width: 75%;
    word-wrap: break-word;
    animation: fadeIn 0.3s ease;
  }

  .assistant .bubble { background: #334155; color: #f1f5f9; border-bottom-left-radius: 4px; }
  .user .bubble { background: #2563eb; color: white; border-bottom-right-radius: 4px; }

  .speak-btn {
    display: inline-block;
    margin-top: 6px;
    background: none;
    border: none;
    color: #93c5fd;
    cursor: pointer;
    font-size: 14px;
    padding: 0 4px;
    transition: color 0.2s;
  }
  .speak-btn:hover { color: #60a5fa; }

  .form-select-sm {
    background-color: #0f172a;
    color: #f8fafc;
    border: 1px solid #334155;
    border-radius: 6px;
    margin-top: 6px;
    width: fit-content;
  }

  .speaking-indicator {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background-color: #38bdf8;
    margin-left: 8px;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.5; }
    100% { transform: scale(1); opacity: 1; }
  }

  .chat-form { display: flex; gap: 10px; margin-top: 10px; }
  .chat-form textarea {
    flex-grow: 1;
    border-radius: 12px;
    border: none;
    padding: 12px;
    background-color: #0f172a;
    color: #f8fafc;
    resize: none;
  }
  .chat-form button {
    background: #3b82f6;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 0 20px;
    font-weight: 500;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .download-buttons { text-align: right; margin-bottom: 10px; }
</style>

<div class="main-wrapper">
  <!-- Sidebar -->
  <div class="session-sidebar">
    <button onclick="window.location.href='/edulink/new'" class="new-chat-btn">➕ New Chat</button>
    {% for sid, sess in sessions.items() %}
      <a href="/edulink?sid={{ sid }}" class="session-link {% if sid == current_session %}active{% endif %}">{{ sess.title }}</a>
    {% endfor %}
  </div>

  <!-- Chat -->
  <div class="chat-container">
    <h4 class="chat-header">EduLink AI Assistant</h4>

    <div class="download-buttons">
      <button id="download-txt" class="speak-btn">⬇️ Text</button>
      <button onclick="window.location.href='/download_pdf'" class="speak-btn">📄 PDF</button>
    </div>

    <div class="chat-box" id="chat-box">
      {% for msg in chat_history %}
        <div class="message {{ msg.role }}">
          {% if msg.role == 'assistant' %}
            <div class="avatar ai-avatar"></div>
            <div class="bubble">{{ msg.content | safe }}</div>
          {% else %}
            <div class="bubble">{{ msg.content }}</div>
            <div class="avatar user-avatar"></div>
          {% endif %}
        </div>
      {% endfor %}
    </div>

    <form id="chat-form" class="chat-form">
      <textarea id="prompt" name="prompt" rows="1" placeholder="Type your message..." required></textarea>
      <button type="button" id="mic-btn">🎙️</button>
      <button type="submit">Send</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const chatBox = document.getElementById('chat-box');
const form = document.getElementById('chat-form');
const promptInput = document.getElementById('prompt');
const micBtn = document.getElementById('mic-btn');
let currentAudio = null;

// ✅ Append Message (with Speak + Translate)
function appendMessage(role, text) {
  const msgDiv = document.createElement('div');
  msgDiv.className = `message ${role}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role === 'assistant' ? 'ai-avatar' : 'user-avatar'}`;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = marked.parse(text);

  if (role === 'assistant') {
    const speakBtn = document.createElement('button');
    speakBtn.textContent = '🔊 Speak';
    speakBtn.className = 'speak-btn';

    const translateBtn = document.createElement('button');
    translateBtn.textContent = '🌍 Translate';
    translateBtn.className = 'speak-btn';

    const langSelect = document.createElement('select');
    langSelect.className = 'form-select form-select-sm';
    langSelect.style.display = 'none';
    langSelect.innerHTML = `
      <option value="">Select Language</option>
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="it">Italian</option>
      <option value="hi">Hindi</option>
      <option value="bn">Bengali</option>
      <option value="ta">Tamil</option>
      <option value="te">Telugu</option>
      <option value="ml">Malayalam</option>
      <option value="kn">Kannada</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
      <option value="zh-cn">Chinese (Simplified)</option>
      <option value="ar">Arabic</option>
      <option value="ru">Russian</option>
      <option value="pt">Portuguese</option>
      <option value="tr">Turkish</option>
      <option value="id">Indonesian</option>
      <option value="th">Thai</option>
      <option value="ur">Urdu</option>
    `;

    translateBtn.onclick = () => {
      langSelect.style.display = langSelect.style.display === 'none' ? 'block' : 'none';
    };

    langSelect.onchange = async () => {
      const lang = langSelect.value;
      if (!lang) return;
      const formData = new FormData();
      formData.append('text', text);
      formData.append('lang', lang);
      const res = await fetch('/edulink/translate', { method: 'POST', body: formData });
      const data = await res.json();
      if (data.translated) {
        bubble.innerHTML += `<hr><b>(${langSelect.options[langSelect.selectedIndex].text}) Translation:</b><br>${data.translated}`;
        langSelect.style.display = 'none';
      } else alert('Translation failed: ' + data.error);
    };

    speakBtn.onclick = async () => {
      if (currentAudio && !currentAudio.paused) {
        currentAudio.pause(); currentAudio.currentTime = 0;
      }
      const formData = new FormData();
      formData.append('text', text);
      const res = await fetch('/edulink/tts', { method: 'POST', body: formData });
      const blob = await res.blob();
      currentAudio = new Audio(URL.createObjectURL(blob));
      currentAudio.play();
      speakBtn.textContent = '⏹️ Stop';
      const dot = document.createElement('span'); dot.className = 'speaking-indicator'; speakBtn.appendChild(dot);
      currentAudio.onended = () => speakBtn.textContent = '🔊 Speak';
    };

    const wrapper = document.createElement('div');
    wrapper.appendChild(bubble);
    wrapper.appendChild(speakBtn);
    wrapper.appendChild(translateBtn);
    wrapper.appendChild(langSelect);
    msgDiv.append(avatar, wrapper);
  } else {
    msgDiv.append(bubble, avatar);
  }

  chatBox.appendChild(msgDiv);
  chatBox.scrollTop = chatBox.scrollHeight;
}

// 🎙 Voice Input
micBtn.addEventListener('click', async () => {
  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = 'en-US';
  recognition.start();
  recognition.onresult = e => promptInput.value = e.results[0][0].transcript;
});

// ✨ Chat Streaming
form.addEventListener('submit', async e => {
  e.preventDefault();
  const prompt = promptInput.value.trim();
  if (!prompt) return;
  appendMessage('user', prompt);
  promptInput.value = '';
  appendMessage('assistant', '...');
  const res = await fetch('/edulink/stream', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({prompt})
  });
  const data = await res.json();
  chatBox.lastChild.remove();
  appendMessage('assistant', data.text);
});

// 💾 Download Chat as TXT
document.getElementById('download-txt').addEventListener('click', () => {
  const messages = Array.from(document.querySelectorAll('.message')).map(msg => {
    const role = msg.classList.contains('assistant') ? 'AI' : 'You';
    const text = msg.querySelector('.bubble').innerText.trim();
    return `${role}: ${text}`;
  }).join('\n\n');
  const blob = new Blob([messages], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `EduLink_Chat_${new Date().toISOString().split('T')[0]}.txt`;
  a.click();
});
</script>
{% endblock %}
