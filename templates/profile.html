{% extends "base.html" %}
{% block content %}
<style>
  body {
    background: radial-gradient(circle at top left, #0f172a, #1e293b);
    color: #f8fafc;
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
  }

  .profile-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 100px); /* space below navbar */
    padding-top: 40px;
  }

  .profile-card {
    background: rgba(30,41,59,0.85);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 40px 50px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    color: #f8fafc;
    max-width: 450px;
    width: 90%;
    position: relative;
    overflow: hidden;
    transition: all 0.4s ease;
  }

  .profile-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(37,99,235,0.15), rgba(147,197,253,0.1));
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .profile-card:hover::before {
    opacity: 1;
  }

  .profile-card:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 20px 40px rgba(37,99,235,0.3);
  }

  .profile-card h3 {
    font-size: 1.8rem;
    font-weight: 600;
    color: #60a5fa;
    margin-bottom: 25px;
    text-shadow: 0 0 8px rgba(96,165,250,0.3);
  }

  .profile-card p {
    font-size: 1.1rem;
    margin: 10px 0;
    color: #cbd5e1;
  }

  .profile-card strong {
    color: #f1f5f9;
  }

  .btn-glow {
    display: inline-block;
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    color: white;
    padding: 10px 24px;
    border-radius: 12px;
    border: none;
    font-weight: 500;
    margin-top: 25px;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 0 10px rgba(59,130,246,0.4);
  }

  .btn-glow:hover {
    background: linear-gradient(135deg, #3b82f6, #60a5fa);
    box-shadow: 0 0 20px rgba(59,130,246,0.6);
    transform: scale(1.05);
  }

  .avatar-ring {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: url("https://cdn-icons-png.flaticon.com/512/1077/1077012.png") center/cover no-repeat;
    border: 3px solid #3b82f6;
    margin: 0 auto 20px;
    box-shadow: 0 0 20px rgba(59,130,246,0.4);
    animation: pulseGlow 3s infinite ease-in-out;
  }

  @keyframes pulseGlow {
    0% { box-shadow: 0 0 10px rgba(59,130,246,0.4); }
    50% { box-shadow: 0 0 25px rgba(59,130,246,0.7); }
    100% { box-shadow: 0 0 10px rgba(59,130,246,0.4); }
  }
</style>

<div class="profile-wrapper">
  <div class="profile-card">
    <div class="avatar-ring"></div>
    <h3> User Profile</h3>
    <p><strong>Username:</strong> {{ username }}</p>
    <p><strong>Role:</strong> {{ role }}</p>
    <a href="{{ url_for('dashboard') }}" class="btn-glow">Back to Dashboard</a>
  </div>
</div>
<script>
document.querySelector('.profile-card').addEventListener('click', (e) => {
  const link = e.currentTarget.querySelector('.btn-glow');
  if (link && !e.target.closest('a, button')) {
    window.location.href = link.href;
  }
});
</script>

{% endblock %}
